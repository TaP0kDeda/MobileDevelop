name: Build and Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./flutter_application_1
        run: flutter pub get

      - name: Build web
        working-directory: ./flutter_application_1
        run: flutter build web --release --base-href /MobileDevelop/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flutter_application_1/build/web
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Pub get
        working-directory: ./flutter_application_1
        run: flutter pub get

      - name: Build APK
        working-directory: ./flutter_application_1
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flutter_application_1/build/app/outputs/flutter-apk/app-release.apk
