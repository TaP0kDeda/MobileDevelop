<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; text-align: center; }
        h2 { color: #333; }
        .card { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        .btn-logout { background-color: #e74c3c; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-logout:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h2>Личный кабинет</h2>
    
    <div class="card">
        <p>Вы вошли как:</p>
        <h3 id="user-display" style="color: #3ecf8e;">Загрузка...</h3>
    </div>

    <button class="btn-logout" onclick="logout()">Выйти из аккаунта</button>

        <script>
        const supabaseUrl = 'https://uyzxabzgnpwejkeezhml.supabase.co';
        const supabaseKey = 'sb_publishable_ZeEf7M92yrpDRRywwUeWaw_kzJVAdkc';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Эта функция отвечает за вывод данных и редирект
        function updateUI(session) {
            if (!session) {
                // Если пользователь не авторизован, выкидываем на логин
                window.location.href = 'test.html';
                return;
            }

            const user = session.user;
            let displayName = 'Пользователь';

            // Достаем имя из OAuth провайдеров
            if (user.user_metadata) {
                displayName = user.user_metadata.full_name 
                           || user.user_metadata.name 
                           || user.user_metadata.user_name;
            }

            // Если имени нет (вход по логину), берем email до @
            if (!displayName && user.email) {
                displayName = user.email.split('@')[0];
            }

            // Убираем "Загрузку..." и пишем имя
            document.getElementById('user-display').innerText = displayName;
        }

        // 1. Проверяем сессию мгновенно при загрузке
        client.auth.getSession().then(({ data: { session } }) => {
            updateUI(session);
        });

        // 2. Слушаем изменения (важно для OAuth, когда токен приходит в URL)
        client.auth.onAuthStateChange((_event, session) => {
            updateUI(session);
        });

        async function logout() {
            await client.auth.signOut();
            window.location.href = 'test.html';
        }
    </script>
</body>
</html>
