<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; text-align: center; }
        h2 { color: #333; }
        .card { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        .btn-logout { background-color: #e74c3c; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-logout:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h2>Личный кабинет</h2>
    
    <div class="card">
        <p>Вы вошли как:</p>
        <h3 id="user-display" style="color: #3ecf8e;">Загрузка...</h3>
    </div>

    <button class="btn-logout" onclick="logout()">Выйти из аккаунта</button>

    <script>
        const supabaseUrl = 'https://<ВАШ_PROJECT_REF>.supabase.co';
        const supabaseKey = '<ВАШ_ANON_KEY>';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Проверяем, залогинен ли пользователь при загрузке страницы
        async function checkUser() {
            const { data: { user }, error } = await client.auth.getUser();

            if (error || !user) {
                // Если не залогинен — выкидываем на страницу входа
                window.location.href = 'test.html';
            } else {
                // Если залогинен — показываем имя
                // Если вход был через обычный юзернейм (мы делали @example.com)
                let displayName = user.email.split('@')[0]; 
                
                // Если вход был через Google/GitHub/Discord, у них есть полное имя
                if (user.user_metadata && user.user_metadata.full_name) {
                    displayName = user.user_metadata.full_name;
                } else if (user.user_metadata && user.user_metadata.name) {
                    displayName = user.user_metadata.name;
                }

                document.getElementById('user-display').innerText = displayName;
            }
        }

        // Запускаем проверку при открытии страницы
        checkUser();

        // 2. Функция выхода
        async function logout() {
            await client.auth.signOut();
            // После выхода перенаправляем на страницу логина
            window.location.href = 'test.html';
        }
    </script>
</body>
</html>
