<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Проверка вставки в базу данных</h1>

    <script>
        const supabaseUrl = 'https://uyzxabzgnpwejkeezhml.supabase.co';
        const supabaseKey = 'sb_publishable_ZeEf7M92yrpDRRywwUeWaw_kzJVAdkc';
        
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function addRow() {
            const { data, error } = await client
                .from('users') 
                .insert([{ username: 'Аня', password: '12345' }])
                .select();

            if (error) {
                console.error('Ошибка:', error.message);
                alert('Ошибка: ' + error.message);
            } else {
                console.log('Успех! Данные:', data);
                alert('Пользователь успешно добавлен!');
            }
        }
        addRow();
    </script>
</body>
</html>
